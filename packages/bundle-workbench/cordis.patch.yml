# TwinDesk's Stage 0 Host layer. The Harness base and Web application bundles
# are composed before this patch by the generated `workbench` Profile.
- insert:
    - id: twindesk-subagent-codex-readonly
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: twindesk-codex-readonly
        permissionMode: never
        env:
          CODEX_HOME: !!js dshHomePath('twindesk-codex-readonly')
    - id: twindesk-work-hub
      name: '@twindesk/plugin-work-hub'
    - id: twindesk-workbench-runtime
      name: '@twindesk/bundle-workbench/cordis-runtime'
      config:
        version: 1
        homeDirectory: !!js "process.env.TWINDESK_HOME_DIRECTORY || process.getBuiltinModule('node:os').homedir()"
        databasePath: !!js "process.getBuiltinModule('node:path').resolve(process.env.TWINDESK_DATABASE_PATH || '.twindesk/twindesk.sqlite3')"
        port: !!js "Number(process.env.TWINDESK_WEB_PORT || '4173')"
        provider: !!js "process.env.TWINDESK_MODEL_PROVIDER || 'deepseek-official'"
        model: !!js "process.env.TWINDESK_MODEL || 'deepseek-v4-flash'"
        feishuTenantKey: !!js 'process.env.TWINDESK_FEISHU_TENANT_KEY || undefined'
    - id: twindesk-ui
      name: '@twindesk/plugin-ui'
